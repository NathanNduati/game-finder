<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
     <header class="top-bar">
        <div class="wrapper">
            <h1>GameFinder</h1>
            <p>Browse free-to-play PC and browser games</p>
        </div>
    </header>
    
    <main class="wrapper">
        <section class="filters">
            <div class="field search-field">
                <label for="search-input">Search</label>
                <input type="text" id="search-input" placeholder="Type a game title...">
            </div>
            
            <div class="field">
                <label for="platform-filter">Platform</label>
                <select id="platform-filter">
                    <option value="all">All Platforms</option>
                    <option value="pc">PC (Windows)</option>
                    <option value="browser">Browser</option>
                </select>
            </div>

            <div class="field">
                <label for="genre-filter">Genre</label>
                <select id="genre-filter">
                    <option value="">All Genres</option>
                    <option value="shooter">Shooter</option>
                    <option value="mmorpg">MMORPG</option>
                    <option value="strategy">Strategy</option>
                    <option value="racing">Racing</option>
                    <option value="sports">Sports</option>
                    <option value="survival">Survival</option>
                    <option value="card">Card</option>
                </select>
            </div>
            
            <div class="field">
                <label for="sort-filter">Sort By</label>
                <select id="sort-filter">
                    <option value="relevance">Relevance</option>
                    <option value="popularity">Popularity</option>
                    <option value="release-date">Newest First</option>
                    <option value="alphabetical">A - Z</option>
                </select>
            </div>
            
            <button type="button" id="clear-btn">Clear</button>
        </section>
        
        <p id="count-text" class="count-text">Loading games...</p>
        <div id="alert-box" class="alert-box hidden"></div>

        <section id="games-list" class="games-list"></section>
    </main>
    
    <div id="details-modal" class="modal hidden">
        <div class="modal-box">
            <button type="button" id="close-modal" class="close-btn">×</button>
            <div id="modal-details"></div>
        </div>
    </div>
        
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
